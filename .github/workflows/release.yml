name: Release APK

# Dedicated APK build channel, kept separate from ci.yml so the compile-only
# gate stays clean. Builds a (debug-signed) arm64 debug APK as a workflow artifact
# for sideload review. It is NOT attached to GitHub Releases: release APKs are
# built locally (minified release variant) and uploaded with the release, so a
# debug-variant APK (different package id) never ends up next to them.
#
# NOTE (Phase 10 CI-SIGNING): AGP 9 signing validation currently throws an EdEC
# NoClassDefFoundError on CI runners (works locally). This workflow opts into
# the BouncyCastle build-classpath workaround via CI_SIGNING_BCPROV. If the
# assemble step still fails, the uploaded stacktrace IS Phase 10's first
# deliverable (capture the trace on an AGP-9 runner).

on:
  workflow_dispatch: {}
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      CI_SIGNING_BCPROV: '1' # opt into the Phase-10 bcprov signing workaround
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Set up JDKs (17 toolchain + 21 runtime)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'temurin'
          java-version: |
            17
            21

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}-jdk17-agp9-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}-jdk17-agp9-

      - name: Assemble debug APK (arm64)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-arm64-v8a-debug
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports + stacktrace on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-failure-reports
          path: |
            **/build/reports/
            **/build/outputs/logs/
          retention-days: 14
          if-no-files-found: ignore
